<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>B Corridor — News Editor</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- LOGIN -->
    <div id="login" class="login-wrap">
      <form class="login-card" id="loginForm">
        <h1>B Corridor News</h1>
        <p class="sub">Sign in to write and edit news posts.</p>
        <div class="field">
          <label for="li-email">Email</label
          ><input id="li-email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="li-pass">Password</label
          ><input
            id="li-pass"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button
          class="btn"
          type="submit"
          style="width: 100%; justify-content: center"
        >
          Sign in
        </button>
      </form>
    </div>

    <!-- APP -->
    <div id="app" class="hidden">
      <div class="topbar">
        <h1>B Corridor News</h1>
        <div>
          <button class="btn btn--ghost btn--sm" id="newBtn">+ New post</button>
          <button class="btn btn--ghost btn--sm" id="logoutBtn">Log out</button>
        </div>
      </div>

      <!-- LIST VIEW -->
      <div class="wrap" id="listView">
        <h2 style="margin-bottom: 16px">Posts</h2>
        <div id="postList"></div>
      </div>

      <!-- EDITOR VIEW -->
      <div class="wrap hidden" id="editView">
        <button
          class="btn btn--ghost btn--sm"
          id="backBtn"
          style="margin-bottom: 16px"
        >
          ← Back to posts
        </button>
        <a
          class="btn btn--ghost btn--sm"
          id="viewLive"
          target="_blank"
          rel="noopener"
          style="
            display: none;
            margin-bottom: 16px;
            margin-left: 8px;
            text-decoration: none;
          "
          >View live ↗</a
        >
        <h2 id="editTitle" style="margin-bottom: 18px">New post</h2>

        <div class="field">
          <label for="f-title">Title</label>
          <input
            id="f-title"
            type="text"
            placeholder="e.g. A Corridor in Bloom"
          />
        </div>

        <div class="field">
          <label for="f-excerpt"
            >Short summary
            <span class="hint"
              >— shown on the cards (1–2 sentences)</span
            ></label
          >
          <textarea
            id="f-excerpt"
            placeholder="A short teaser that appears on the News page and homepage."
          ></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="f-category">Category</label>
            <select id="f-category">
              <option>Action</option>
              <option>Education</option>
              <option>Community</option>
            </select>
          </div>
          <div class="field">
            <label for="f-date">Date</label>
            <input id="f-date" type="date" />
          </div>
        </div>

        <div class="field">
          <label for="f-author">Author</label>
          <input id="f-author" type="text" placeholder="e.g. B Corridor Team" />
        </div>

        <div class="field">
          <label
            >Featured image
            <span class="hint">— the big photo at the top</span></label
          >
          <input type="file" id="f-featfile" accept="image/*" />
          <input type="hidden" id="f-featimg" />
          <img class="feat-preview" id="featPreview" alt="" />
          <button
            type="button"
            class="btn btn--danger btn--sm"
            id="featRemove"
            style="display: none; margin-top: 8px"
          >
            ✕ Remove featured image
          </button>
        </div>

        <div class="field">
          <label>Article text</label>
          <div class="editor-toolbar">
            <button type="button" data-cmd="bold" title="Bold">
              <strong>B</strong>
            </button>
            <button type="button" data-cmd="italic" title="Italic">
              <em>i</em>
            </button>
            <button type="button" data-block="h2" title="Heading">H2</button>
            <button type="button" data-block="h3" title="Sub-heading">
              H3
            </button>
            <button
              type="button"
              data-cmd="insertUnorderedList"
              title="Bulleted list"
            >
              • List
            </button>
            <button type="button" data-block="blockquote" title="Quote">
              ❝ Quote
            </button>
            <button type="button" id="linkBtn" title="Add link">🔗 Link</button>
            <button type="button" id="imgBtn" title="Insert image">
              🖼 Image
            </button>
            <button
              type="button"
              id="carouselBtn"
              title="Add an image carousel (several photos)"
            >
              🎠 Carousel
            </button>
            <button
              type="button"
              id="videoBtn"
              title="Add a YouTube or Vimeo video"
            >
              🎬 Video
            </button>
          </div>
          <div
            class="editor"
            id="f-body"
            contenteditable="true"
            data-placeholder="Write your article here…"
          ></div>
          <input type="file" id="bodyImgFile" accept="image/*" class="hidden" />
          <input
            type="file"
            id="carouselFiles"
            accept="image/*"
            multiple
            class="hidden"
          />
        </div>

        <div class="field" style="max-width: 220px">
          <label for="f-status">Visibility</label>
          <select id="f-status">
            <option value="published">Published (live on the site)</option>
            <option value="draft">Draft (only you can see it)</option>
          </select>
        </div>

        <div class="actions">
          <button class="btn" id="saveBtn">Save</button>
          <button class="btn btn--danger" id="deleteBtn" style="display: none">
            Delete
          </button>
          <div class="spacer"></div>
        </div>
        <p class="hint" style="margin-top: 10px; color: var(--muted)">
          After saving, the live site updates automatically in about a minute.
        </p>
      </div>
    </div>

    <!-- carousel caption modal -->
    <div class="modal-backdrop hidden" id="capModal">
      <div class="modal">
        <h3 id="capTitle">Add carousel photos</h3>
        <p class="modal-sub" id="capSub">
          Type a caption under each photo if you like — or leave it blank.
        </p>
        <div id="capList"></div>
        <div class="modal-actions">
          <button
            class="btn btn--danger"
            type="button"
            id="capDelete"
            style="margin-right: auto; display: none"
          >
            Delete carousel
          </button>
          <button class="btn btn--ghost" type="button" id="capCancel">
            Cancel
          </button>
          <button class="btn" type="button" id="capConfirm">
            Add to article
          </button>
        </div>
      </div>
    </div>

    <button class="img-remove hidden" type="button" id="imgRemove">
      ✕ Remove image
    </button>

    <div class="toast" id="toast"></div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
